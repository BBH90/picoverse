<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico e il pianeta dei dinosauri - anteprima</title>
<meta name="description" content="Pico ha trovato un uovo sul pianeta dei dinosauri... Il libro da colorare con una storia per bambini 3-6 anni.">
<style>
  :root { --sky:#5fd3fd; --teal:#0e585c; --orange:#ff8c3c; --plum:#4a2062; --cream:#fff7e4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg, var(--sky) 0%, #2fa9b0 45%, var(--teal) 100%);
         color:var(--cream); font-family:"Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:20px 16px 32px; text-align:center; }
  .serie { font-size:14px; color:#fff; opacity:.9; margin-top:4px; }
  h1 { color:var(--orange); font-size:clamp(28px,7.5vw,46px); margin:6px 0 4px; line-height:1.05;
       text-shadow: 0 3px 0 var(--plum), 2px 0 0 var(--plum), -2px 0 0 var(--plum), 0 -2px 0 var(--plum); }
  p.sub { margin:4px 0 16px; font-size:clamp(15px,4vw,18px); color:#fff; }
  .player { width:100%; max-width:760px; border-radius:22px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.35);
            border:4px solid var(--orange); background:#000; }
  video { display:block; width:100%; height:auto; }
  .tip { margin-top:14px; font-size:15px; max-width:460px; }
  .cta { display:inline-block; margin-top:18px; padding:13px 26px; border-radius:30px; background:var(--orange); color:var(--plum);
         font-weight:bold; text-decoration:none; font-size:17px; border:3px solid var(--plum); }
  footer { margin-top:26px; font-size:14px; opacity:.85; }
  footer b { color:var(--orange); }
</style>
</head>
<body>
  <div class="serie">Le avventure di Pico · n. 2</div>
  <h1>Pico e il pianeta<br>dei dinosauri</h1>
  <p class="sub">Libro da colorare con una storia · 3-6 anni</p>
  <div class="player">
    <video src="pico-anteprima.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <p class="tip">Premi ▶ e alza il volume 🔊<br>Un uovo tutto solo, un piccolo triceratopo che cerca la mamma e tante impronte da seguire… e all'ultima pagina Pico prende vita!</p>
  <footer><b>Picoverse</b> · Le avventure di Pico</footer>
</body>
</html>
